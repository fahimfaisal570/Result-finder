name: Exam Publication Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: exam-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fast Detection (Check Only)
      id: check
      run: python exam_monitor/monitor.py --check-only

    - name: Install Heavy Dependencies
      if: steps.check.outputs.new_exams == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y wkhtmltopdf xvfb libfontconfig
        pip install pdfkit

    - name: Run Full Monitor (PDF Generation & Mailing)
      if: steps.check.outputs.new_exams == 'true'
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        CIVIL_HEAD_EMAIL: ${{ secrets.CIVIL_HEAD_EMAIL }}
        EEE_HEAD_EMAIL: ${{ secrets.EEE_HEAD_EMAIL }}
        CSE_HEAD_EMAIL: ${{ secrets.CSE_HEAD_EMAIL }}
      run: xvfb-run python exam_monitor/monitor.py

    - name: Cross-Branch Sync to v2
      if: steps.check.outputs.new_exams == 'true'
      run: |
        if [ -f "v2_sync_tasks.json" ]; then
          echo "Sync tasks found. Preparing for v2 sync..."
          cp v2_sync_tasks.json /tmp/v2_sync_tasks.json
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stash local changes to known_exams.json and system_cache.json
          echo "Stashing local changes before branch switch..."
          git stash
          
          # Switch to v2
          git fetch origin v2
          git checkout v2
          
          # Install v2 dependencies
          echo "Installing dependencies for v2 sync..."
          pip install -r requirements.txt
          
          # Run sync
          echo "Running v2 sync script..."
          python v2_auto_sync.py
          
          # Commit and Push to v2
          if [ -f "result_finder.db" ]; then
            git add result_finder.db
            if [ -f "readd_notifications.json" ]; then
              git add readd_notifications.json
            fi
            git commit -m "chore: auto-sync latest exams to analytics db [skip ci]" || echo "No changes to commit"
            git push origin v2
          fi
          
          echo "Sync complete. Returning to main branch..."
          git checkout main
          
          # Restore local changes for the final commit on main
          echo "Restoring stashed changes..."
          git stash pop || echo "No stashed changes to restore"
        else
          echo "No sync tasks generated."
        fi

    - name: Commit and Push changes
      if: steps.check.outputs.new_exams == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update known exams [skip ci]"
        file_pattern: 'exam_monitor/known_exams.json'
